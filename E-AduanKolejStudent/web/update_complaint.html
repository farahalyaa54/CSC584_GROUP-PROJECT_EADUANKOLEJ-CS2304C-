<!DOCTYPE html>
<html>
<head>
    <title>Update Complaint</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="navbar">
        <span><strong>E-Aduan Kolej</strong></span>
        <a href="student_dashboard.html">Dashboard</a>
    </div>
    <div class="container">
        <h2>Update Complaint (TKT-1001)</h2>
        <form action="my_complaints.html">
            <label>Ticket ID (Cannot be changed):</label>
            <input type="text" value="TKT-1001" readonly style="background:#eee;">

            <label>Damage Category:</label>
            <select>
                <option selected>Electrical</option>
                <option>Plumbing</option>
                <option>Aircond</option>
                <option>Furniture</option>
            </select>

            <label>Room / Location:</label>
            <input type="text" value="A-204" required>

            <label>Problem Description:</label>
            <textarea rows="4" required>Ceiling fan not spinning and making loud noise.</textarea>

            <button type="submit" class="btn">Save Changes</button>
            <a href="my_complaints.html" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</body>
</html>
