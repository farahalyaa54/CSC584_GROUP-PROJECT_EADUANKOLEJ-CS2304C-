<!DOCTYPE html>
<html>
<head>
    <title>Submit E-Aduan</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="navbar">
        <span><strong>E-Aduan Kolej</strong></span>
        <div>
            <a href="student_dashboard.html">Dashboard</a>
            <a href="index.html">Logout</a>
        </div>
    </div>
    <div class="container">
        <h2>Submit E-Aduan Complaint</h2>
        <form action="aduan_confirmation.html">
            <label>Damage Category:</label>
            <select>
                <option>Electrical (Lights, Fan, Socket)</option>
                <option>Plumbing (Pipe Leak, Tap, Toilet)</option>
                <option>Aircond / Ventilation</option>
                <option>Furniture (Bed, Desk, Wardrobe)</option>
            </select>

            <label>College Block:</label>
            <select>
                <option>Kolej Mawar - Block A</option>
                <option>Kolej Mawar - Block B</option>
                <option>Kolej Melati - Block C</option>
            </select>

            <label>Room / Location:</label>
            <input type="text" placeholder="e.g. A-204" required>

            <label>Problem Description:</label>
            <textarea rows="4" placeholder="Describe the issue in detail..." required></textarea>

            <label>Upload Photo Evidence (Optional):</label>
            <input type="file" accept="image/*">

            <br>
            <button type="submit" class="btn">Submit Complaint</button>
            <a href="student_dashboard.html" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</body>
</html>
