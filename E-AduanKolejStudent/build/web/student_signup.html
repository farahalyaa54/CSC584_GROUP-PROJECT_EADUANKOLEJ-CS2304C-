<!DOCTYPE html>
<html>
<head>
    <title>Student Sign Up - E-Aduan Kolej</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="navbar">
        <span><strong>E-Aduan Kolej</strong></span>
        <a href="index.html">Home</a>
    </div>

    <div class="container" style="max-width: 500px;">

        <h2>Student Registration</h2>

        <form action="student_login.html">

            <input type="hidden" name="role_id" value="1">

            <label>Student Name:</label>
            <input type="text" name="student_name"
                   placeholder="e.g. Aina Sofia" required>

            <label>Phone Number:</label>
            <input type="text" name="phone_number"
                   placeholder="e.g. 012-3456789" required>

            <label>Password:</label>
            <input type="password" name="password"
                   maxlength="25" required>

            <button type="submit" class="btn">Register</button>

            <a href="student_login.html" class="btn btn-secondary">
                Back to Login
            </a>

        </form>

    </div>

</body>
</html>
